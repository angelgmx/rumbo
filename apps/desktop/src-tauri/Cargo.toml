[package]
name = "rumbo"
version = "0.1.0"
description = "Rumbo: qué toca hoy, sobre tu vault de Obsidian"
authors = ["Angel Gómez"]
license-file = "../../../LICENSE"
edition = "2024"
rust-version = "1.90"

[lib]
name = "rumbo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
# Lo usa la macro generate_context! para leer la configuración de los plugins.
serde_json = "1"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-opener = "2"
