[package]
name = "rumbo"
version = "0.1.0"
description = "Rumbo: qué toca hoy, sobre tu vault de Obsidian"
authors = ["Angel Gómez"]
license-file = "../../../LICENSE"
edition = "2024"
rust-version = "1.90"

[lib]
name = "rumbo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
# Lo usa la macro generate_context! para leer la configuración de los plugins.
serde_json = "1"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-opener = "2"
# La IA se llama desde la app: el plugin http no tiene las limitaciones de CORS del WebView.
tauri-plugin-http = "2"
# La clave de la IA, en el llavero del sistema (Secret Service en Linux, sin depender de libdbus).
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "async-secret-service",
  "tokio",
  "crypto-rust",
] }
